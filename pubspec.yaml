name: campusfix
description: A responsive school and community issue reporting prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  web: ^1.1.1
  image: ^4.8.0
  image_picker: ^1.2.2
  http: ^1.6.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/campusfix_logo.png
